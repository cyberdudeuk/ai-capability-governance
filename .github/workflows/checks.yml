name: Checks
# Tier 0 (ops/automation.yaml). Every pull request and every push to main runs the static checks, the vaccination tests
# (every check must fail on a deliberate break) and a syntax check of app.js. The publish routine (pages.yml) checks
# again before it publishes, and the "Protect main" ruleset only lets a change reach main through a pull request.
# Mondays it also runs the health run and opens or updates a health issue for a person. Plain commands only (ADR 0002).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly health run, Monday morning
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the commit (plain git; the repository allows no third-party actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Python environment (runner's own Python 3, isolated in a virtual environment)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        run: pip install -r requirements.txt
      - name: Static checks
        run: python tools/check_site.py
      - name: Vaccination and automation tests
        run: python -m unittest discover -s tests -v
      - name: Script syntax
        run: node --check app.js
      - name: Browser checks (runner's own Chrome; no browser download)
        run: python tools/check_browser.py
      - name: Browser check vaccinations (each must catch its deliberate break)
        run: for b in overflow consoleerror contact; do python tools/check_browser.py --break "$b"; done
      - name: Health run (review date, signals freshness)
        id: health
        run: |
          set +e
          python tools/health.py > health.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat health.txt
      - name: Open or update a health issue for a person to act on
        if: steps.health.outputs.code == '2' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The weekly health run found problems. Nothing has been changed automatically.\n\n```\n%s\n```\n\nClose this issue when a person has reviewed and fixed each problem.' "$(cat health.txt)")"
          existing=$(gh issue list --label health --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Health run needs attention" --label health --body "$body"; fi
