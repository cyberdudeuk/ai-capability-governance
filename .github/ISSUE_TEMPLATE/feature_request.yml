name: A tool, section or source you need
description: Something missing that would help you govern or deliver AI safely
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Do not include personal data, names of colleagues, case details or anything above OFFICIAL.
        There is no email route: this form is the way to contact the maintainers.
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the task, not the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: level
    attributes:
      label: How would you describe yourself?
      options:
        - Beginner (new to AI in public services, or to this site)
        - Intermediate (using, buying or approving AI in my work)
        - Advanced (building, assuring or reusing this guidance)
        - Prefer not to say
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal data, case details or anything above OFFICIAL
          required: true
